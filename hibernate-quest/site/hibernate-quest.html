<style>

<script>
/* ================= COURSE DATA (replace everything in this block) ================= */
const CONFIG = {
  title: 'Hibernate Quest',
  storageKey: 'hibernate-quest-v1',
  labs: [
    { name: '1 · Hibernate intro', url: 'hibernate-intro.html' },
    { name: '2 · Internals', url: 'hibernate-internals.html' },
    { name: '3 · Relationships', url: 'jpa-relationships.html' },
    { name: '4 · Cascade & N+1', url: 'jpa-fetching.html' },
    { name: '5 · Spring Data JPA', url: 'spring-data-jpa.html' }
  ],
  localProject: 'hibernate-quest/practice',
};
const LAB1 = CONFIG.labs[0].url, L2 = CONFIG.labs[1].url, L3 = CONFIG.labs[2].url, L4 = CONFIG.labs[3].url, L5 = CONFIG.labs[4].url;
const deep = (url, id, text) => `<p class="deep">Deep dive: <a href="${url}#${id}" target="_blank" rel="noopener">${text}</a></p>`;

const SEED = `CREATE TABLE departments (id INTEGER PRIMARY KEY, name TEXT NOT NULL, active INTEGER NOT NULL);
INSERT INTO departments VALUES (10,'Engineering',1),(20,'HR',1),(30,'Design',0);
CREATE TABLE students (
  id INTEGER PRIMARY KEY AUTOINCREMENT,
  name TEXT NOT NULL,
  email TEXT NOT NULL UNIQUE,
  age INTEGER,
  active INTEGER NOT NULL DEFAULT 1,
  department_id INTEGER REFERENCES departments(id)
);
INSERT INTO students(name,email,age,active,department_id) VALUES
  ('Rahul','rahul@gmail.com',24,1,10),('Priya','priya@gmail.com',22,1,10),('Aman','aman@gmail.com',27,0,20),
  ('Neha','neha@gmail.com',21,1,30),('Harsh','harsh@gmail.com',23,1,NULL),('Kabir','kabir@gmail.com',26,1,20),
  ('Isha','isha@gmail.com',25,0,10);
CREATE TABLE student_skills (student_id INTEGER NOT NULL, skill TEXT NOT NULL);
INSERT INTO student_skills VALUES (1,'Java'),(1,'SQL'),(2,'Spring'),(1,'Spring'),(6,'Java');
CREATE TABLE courses (id INTEGER PRIMARY KEY, title TEXT NOT NULL);
INSERT INTO courses VALUES (101,'Java'),(102,'Spring'),(103,'SQL');
CREATE TABLE student_course (student_id INTEGER NOT NULL, course_id INTEGER NOT NULL, UNIQUE(student_id, course_id));
INSERT INTO student_course VALUES (1,101),(1,102),(2,101),(2,103),(6,102);
CREATE TABLE accounts (id INTEGER PRIMARY KEY, balance INTEGER NOT NULL);
INSERT INTO accounts VALUES (1,1000),(2,500);`;

const has = re => c => re.test(c);
const not = re => c => !re.test(c);
const sqlVar = c => (c.match(/String sql ?= ?("(?:[^"\\]|\\.)*"(?: ?\+ ?[^;]+)?);/) || [])[1] || '';
const ann = (c, re) => (c.match(re) || [])[1] || '';
// @AttributeOverride(name = "field", column = @Column(name = "col")) inside a code segment
const ovr = (seg, f, col) => new RegExp(`@AttributeOverride\\(name ?= ?"${f}", ?column ?= ?@Column\\(name ?= ?"${col}"\\)\\)`).test(seg);
const ADDR = [['addressLine','address_line'],['city','city'],['state','state'],['postalCode','postal_code']];
const mergeVar = c => (c.match(/Student (\w+) ?= ?entityManager\.merge\(detached\);/) || [])[1];

const COURSE = [
/* ===================================================== CHAPTER 1 */
{ id:'c1', title:'Chapter 1 · Meet Hibernate', lessons:[

{ id:'1-1', title:'Why an ORM at all?', kind:'quiz', xp:10,
  body:`<div class="ana">You speak Hindi, the shopkeeper speaks Tamil. Looking up every word yourself, every time, is Spring JDBC. Handing a translator a dictionary <i>once</i> is an ORM.</div>
<p>Java has classes, objects, references and collections. A database has tables, rows, columns, keys and joins. Same data, different shape: the <b>object-relational impedance mismatch</b>.</p>
<p>With Spring JDBC you still write each SQL string, bind values in <code>?</code> order (a wrong order compiles fine) and copy each column back with a RowMapper. An <b>ORM</b> lets you declare the mapping once (<code>@Entity</code>, <code>@Column</code>) and reuses it everywhere.</p>
<p><b>JPA</b> (now <i>Jakarta Persistence</i>) is the specification: interfaces and annotations in <code>jakarta.persistence</code>. <b>Hibernate</b> is the provider that implements it and runs above JDBC. Like <code>List</code> and <code>ArrayList</code>.</p>
${deep(LAB1,'mismatch','break the parameter order yourself')}`,
  qs:[
    {q:'What does Spring JDBC still make you do by hand?', o:['Open and close connections','Write SQL, bind values in order, map rows to objects','Manage the connection pool','Nothing; it maps objects automatically'], a:1, ex:'JdbcTemplate removed the plumbing, not the translation.'},
    {q:'<code>jakarta.persistence.EntityManager</code> is…', o:['Hibernate\'s own class','A JPA interface; the runtime object is Hibernate\'s','Part of Spring JDBC','A MySQL driver class'], a:1, ex:'Interface from the spec, implementation from the provider.'},
    {q:'Where does Hibernate sit?', o:['Instead of JDBC','Above JDBC, which talks to the driver and database','Inside MySQL','Between the browser and the controller'], a:1, ex:'Application → Hibernate → JDBC → driver → database.'},
    {q:'Which is <b>not</b> an ORM responsibility from the notes?', o:['SQL generation','Result-set mapping','Relationship management','Rendering HTML views'], a:3, ex:'ORM: mapping metadata, SQL generation, binding, result mapping, relationships, caching, transactions.'}]},

{ id:'1-2', title:'Be the ORM: the INSERT', kind:'quiz', xp:15,
  body:`<p>Before trusting Hibernate, do its job once. When you call <code>entityManager.persist(new Student("Zoya", "zoya@gmail.com", 20))</code>, Hibernate reads the mapping and sends an INSERT, binding values from the fields. <code>id</code> is left out because <code>GenerationType.IDENTITY</code> lets the database fill it.</p>
<pre>INSERT INTO students(name, email, age) VALUES (?, ?, ?)</pre>
<p>With the real values bound, the database receives:</p>
<pre>INSERT INTO students(name, email, age) VALUES ('Zoya', 'zoya@gmail.com', 20);</pre>`,
  qs:[
    {q:'Which statement does Hibernate send for <code>persist(new Student("Zoya", "zoya@gmail.com", 20))</code>?', o:['<code>UPDATE students SET name = ?, email = ?, age = ?</code>','<code>INSERT INTO students(name, email, age) VALUES (?, ?, ?)</code>','<code>INSERT INTO students(id, name, email, age) VALUES (?, ?, ?, ?)</code>','<code>SELECT * FROM students</code>'], a:1, ex:'A new object means an INSERT. The id is not part of it.'},
    {q:'Why is <code>id</code> missing from the INSERT?', o:['ids are optional in SQL','<code>GenerationType.IDENTITY</code> lets the database generate it','Hibernate adds it later with an UPDATE','it is a mistake in the mapping'], a:1, ex:'IDENTITY means the database (AUTO_INCREMENT) fills the id.'},

{ id:'1-3', title:'Your first entity', kind:'java', xp:25, file:'Student.java',

<pre><span class="tk">@Entity</span>
<span class="tk">@Table</span>(name = <span class="ts">"students"</span>)

<p>For exact decimals use <code>BigDecimal</code> with <code>precision</code> (all digits) and <code>scale</code> (after the point): 98.75 is precision 4, scale 2. <code>@Transient</code> fields aren't stored at all.</p>

{ id:'1-7', title:'The Y/N converter', kind:'quiz', xp:15,
  body:`<p>The database stores <code>'Y'</code> / <code>'N'</code>, Java wants a <code>Boolean</code>. An <code>AttributeConverter&lt;Boolean, String&gt;</code> has two halves: <code>convertToDatabaseColumn</code> and <code>convertToEntityAttribute</code>, used with <code>@Convert(converter = BooleanToYesNoConverter.class)</code>.</p>
<pre>@Converter
public class BooleanToYesNoConverter implements AttributeConverter&lt;Boolean, String&gt; {

    public String convertToDatabaseColumn(Boolean value) {
        if (value == null) return null;
        return value ? "Y" : "N";
    }

    public Boolean convertToEntityAttribute(String value) {
        if (value == null) return null;
        return "Y".equals(value);      // only an exact "Y" means true
    }
}</pre>
${deep(LAB1,'convert','try the converter both ways')}`,
  qs:[
    {q:'<code>convertToDatabaseColumn(true)</code> returns…', o:['"Y"','"N"','"true"','null'], a:0, ex:'true is stored as "Y".'},
    {q:'<code>convertToEntityAttribute("y")</code> (lower case) returns…', o:['true','false','null','it throws'], a:1, ex:'Only an exact "Y" means true, so "y" gives false.'},
    {q:'<code>convertToDatabaseColumn(null)</code> returns…', o:['"N"','"Y"','null','it throws'], a:2, ex:'Null must stay null in both directions.'},
    {q:'Which line attaches the converter to a field?', o:['<code>@Transient</code>','<code>@Enumerated(EnumType.STRING)</code>','<code>@Convert(converter = BooleanToYesNoConverter.class)</code>','<code>@Id</code>'], a:2, ex:'@Convert on the field names the converter class.'},
    {q:'Which is the safe check for "Y"?', o:['<code>value.equals("Y")</code>','<code>"Y".equals(value)</code>','<code>value == "Y"</code>','<code>value.isEmpty()</code>'], a:1, ex:'"Y".equals(value) does not crash when value is null, and compares the text. == compares references.'}]},

{ id:'1-8', title:'Two addresses, one set of columns', kind:'java', xp:30, file:'Student.java',
  body:`<div class="ana">An address has no identity of its own; it belongs to the student. That makes it a <b>value type</b>: <code>@Embeddable</code> class, used with <code>@Embedded</code>, flattened into the student row.</div>
<p><code>Address</code> has <code>addressLine</code>, <code>city</code>, <code>state</code>, <code>postalCode</code> → columns <code>address_line</code>, <code>city</code>, <code>state</code>, <code>postal_code</code>.</p>
<div class="warn">This entity embeds Address <b>twice</b>, so both want the same four columns. The app fails at startup with a repeated column mapping.</div>
<p>Fix it with <code>@AttributeOverride(name = "city", column = @Column(name = "current_city"))</code> for every field. <code>name</code> is the <b>Java field</b>, not the old column. Wrap several in <code>@AttributeOverrides({ … })</code>.</p>
${deep(LAB1,'embed','watch the columns collide')}`,
  task:{t:'Rename the embedded columns', items:['currentAddress → current_address_line, current_city, current_state, current_postal_code','permanentAddress → permanent_…','Keep currentAddress declared first.']},
  starter:`@Entity
@Table(name = "students")
public class Student {
    @Id
    @GeneratedValue(strategy = GenerationType.IDENTITY)
    private Long id;

    // TODO: override the four columns for the current address
    @Embedded
    private Address currentAddress;

    // TODO: and for the permanent address
    @Embedded
    private Address permanentAddress;
}`,
  tests:[
    {n:'currentAddress: all four renamed', t:c => { const seg = c.split('private Address currentAddress;')[0]; return c.includes('private Address currentAddress;') && ADDR.every(([f, col]) => ovr(seg, f, 'current_' + col)); }, h:'Above currentAddress: @AttributeOverride(name = "addressLine", column = @Column(name = "current_address_line")) and the same for city, state, postalCode.'},
    {n:'permanentAddress: all four renamed', t:c => { const parts = c.split('private Address currentAddress;'); const seg = (parts[1] || '').split('private Address permanentAddress;')[0]; return ADDR.every(([f, col]) => ovr(seg, f, 'permanent_' + col)); }, h:'Between the two fields: overrides with permanent_address_line, permanent_city, permanent_state, permanent_postal_code.'},
    {n:'name = Java field names', t:not(/@AttributeOverride\(name ?= ?"(address_line|postal_code)"/), h:'name is the field (addressLine, postalCode), not the column.'},
    {n:'Both are still @Embedded', t:c => (c.match(/@Embedded\b/g) || []).length >= 2, h:'Keep @Embedded on both fields.'}],
  solution:`@Entity
@Table(name = "students")
public class Student {
    @Id
    @GeneratedValue(strategy = GenerationType.IDENTITY)
    private Long id;

    @Embedded
    @AttributeOverrides({
        @AttributeOverride(name = "addressLine", column = @Column(name = "current_address_line")),
        @AttributeOverride(name = "city", column = @Column(name = "current_city")),
        @AttributeOverride(name = "state", column = @Column(name = "current_state")),
        @AttributeOverride(name = "postalCode", column = @Column(name = "current_postal_code"))
    })
    private Address currentAddress;

    @Embedded
    @AttributeOverrides({
        @AttributeOverride(name = "addressLine", column = @Column(name = "permanent_address_line")),
        @AttributeOverride(name = "city", column = @Column(name = "permanent_city")),
        @AttributeOverride(name = "state", column = @Column(name = "permanent_state")),
        @AttributeOverride(name = "postalCode", column = @Column(name = "permanent_postal_code"))
    })
    private Address permanentAddress;
}`},

{ id:'1-9', title:'A set of skills needs its own table', kind:'java', xp:25, file:'Student.java',
  body:`<p>A <code>Set&lt;String&gt;</code> can't fit in one column. <code>@ElementCollection</code> stores it in a separate <b>collection table</b>; <code>@CollectionTable</code> names it and its join column; <code>@Column</code> names the value column.</p>
<p>Those rows aren't entities: there's no <code>find(Skill.class, id)</code>. Each value belongs to its student. The same works for a collection of embeddables like <code>PhoneNumber</code>.</p>
${deep(LAB1,'elemcoll','add skills and watch the table')}`,
  task:{t:'Map skills to student_skills', items:['Table <code>student_skills</code>, join column <code>student_id</code>','Value column <code>skill</code>','Values, not entities: no @OneToMany']},
  starter:`@Entity
@Table(name = "students")
public class Student {
    @Id
    @GeneratedValue(strategy = GenerationType.IDENTITY)
    private Long id;

    // TODO: store these in table student_skills (student_id, skill)
    private Set<String> skills = new HashSet<>();
}`,
  tests:[
    {n:'@ElementCollection', t:has(/@ElementCollection\b/), h:'A collection of basic values → @ElementCollection.'},
    {n:'Table student_skills with student_id', t:c => /@CollectionTable\(/.test(c) && /name ?= ?"student_skills"/.test(c) && /joinColumns ?= ?@JoinColumn\(name ?= ?"student_id"\)/.test(c), h:'@CollectionTable(name = "student_skills", joinColumns = @JoinColumn(name = "student_id"))'},
    {n:'Value column skill', t:has(/@Column\(name ?= ?"skill"\)/), h:'@Column(name = "skill")'},
    {n:'Not an entity relationship', t:not(/@OneToMany|@ManyToMany/), h:'Strings aren\'t entities; no @OneToMany.'},
    {n:'Field still initialised', t:has(/private Set<String> skills ?= ?new HashSet<>\(\);/), h:'Keep = new HashSet<>();'}],
  solution:`@Entity
@Table(name = "students")
public class Student {
    @Id
    @GeneratedValue(strategy = GenerationType.IDENTITY)
    private Long id;

    @ElementCollection

{ id:'2-1', title:'Factory, manager, context', kind:'quiz', xp:10,
  body:`<div class="ana">A carpenter's <b>workbench</b>: pieces are brought from the warehouse, photographed, worked on, and at the end only changed pieces go back. The bench is the <b>persistence context</b>; the carpenter's hands are the <code>EntityManager</code>.</div>
<p><code>EntityManagerFactory</code>: expensive, app-wide, holds metadata. <code>EntityManager</code>: short-lived, one unit of work, <b>not thread-safe</b>. Persistence context: tracks managed entities, usually per transaction. Hibernate's native names: <code>SessionFactory</code> and <code>Session</code> (they extend the JPA ones).</p>
<p>Repositories are singletons, so Spring injects a <b>shared proxy</b> via <code>@PersistenceContext</code> that routes each call to the current transaction's EntityManager.</p>
${deep(L2,'proxy','two requests, one repository')}`,
  qs:[
    {q:'Which lives for the whole application?', o:['EntityManager','Persistence context','EntityManagerFactory','A transaction'], a:2, ex:'Expensive to create; shared.'},
    {q:'Why does @PersistenceContext inject a proxy?', o:['To make it faster','The real EntityManager isn\'t thread-safe; the proxy routes per transaction','Proxies are required by MySQL','To disable caching'], a:1, ex:'Request A → EM A, Request B → EM B.'},
    {q:'Hibernate\'s native equivalent of EntityManager?', o:['SessionFactory','Session','Transaction','DataSource'], a:1, ex:'Session extends EntityManager.'},
    {q:'find() and the context: on a miss Hibernate…', o:['throws','SELECTs, builds the object, stores it, manages it','returns null always','creates a new row'], a:1, ex:'Key is (entity type, id).'}]},

{ id:'2-2', title:'Count the SELECTs', kind:'quiz', xp:15,
  body:`<p>The first-level cache lives inside the persistence context. Count how many SQL statements Hibernate runs for a list of operations.</p>
<dl class="map"><dt><code>"find 1"</code></dt><dd>cache hit → no SQL; miss → 1 SELECT, then cached</dd><dt><code>"detach 1"</code></dt><dd>remove only entity 1 from the context</dd><dt><code>"clear"</code></dt><dd>empty the context</dd><dt><code>"newtx"</code></dt><dd>new transaction = new, empty context</dd><dt><code>"query"</code></dt><dd>a JPQL query: <b>always</b> 1 SQL (doesn't change the cache here)</dd></dl>
<pre>find 1, find 1          → 1 SQL  (second find is a cache hit)
find 1, find 2, find 1  → 2 SQL</pre>
${deep(L2,'cache','click through the cache simulator')}`,
  qs:[

{ id:'2-3', title:'Dirty checking', kind:'quiz', xp:15,
  body:`<p>At flush, Hibernate compares each managed entity with the <b>snapshot</b> it took when loading. If a field differs, it sends an UPDATE for the changed fields. If nothing changed (setting the same value counts as no change), it sends nothing.</p>
<pre>snapshot: {id:1, name:'Rahul', age:24}
current:  {id:1, name:'Rohan', age:24}
→ UPDATE students SET name = ? WHERE id = ?</pre>
<p>Changed fields are listed in the snapshot's order, <code>id</code> is skipped. (Hibernate by default may list every column; here we list only what changed.)</p>
${deep(L2,'dirty','snapshot vs current, live')}`,
  qs:[
    {q:'At flush, what does Hibernate compare?', o:['two different entities with each other','each managed entity with the snapshot taken when it was loaded','the entity with its Java class','the entity with the next transaction'], a:1, ex:'Snapshot vs current state is dirty checking.'},
    {q:'You call <code>setName("Rahul")</code> on a student already named Rahul. The flush sends…', o:['an UPDATE of name','no UPDATE: nothing changed','an INSERT','an exception'], a:1, ex:'Same value, no change, no SQL.'},
    {q:'Name and age changed, email did not. Which UPDATE lists only what changed?', o:['<code>UPDATE students SET name = ?, email = ?, age = ? WHERE id = ?</code>','<code>UPDATE students SET name = ? WHERE id = ?</code>','<code>UPDATE students SET name = ?, age = ? WHERE id = ?</code>','<code>UPDATE students SET age = ? WHERE id = ?</code>'], a:2, ex:'Only the changed fields, in snapshot order.'},
    {q:'Do you need to call save() or update() on a loaded, managed entity to store a changed field?', o:['Yes: nothing is saved without it','Yes: call merge() on it first','No: changing the field inside a transaction is enough','No: but you must call flush() yourself'], a:2, ex:'Dirty checking writes the UPDATE at flush. JPA does not even have an update() method.'}]},

{ id:'2-4', title:'Name the state', kind:'quiz', xp:15,
  body:`<dl class="map"><dt>Transient</dt><dd><code>new Student()</code>: not tracked, no row</dd><dt>Managed</dt><dd>after <code>persist()</code> or <code>find()</code>; tracked (SQL may not have run yet)</dd><dt>Detached</dt><dd>after <code>detach()</code>, <code>clear()</code> or the context ending; changes ignored</dd><dt>Removed</dt><dd>after <code>remove()</code>; DELETE at flush</dd></dl>
${deep(L2,'lifecycle','drive the lifecycle machine')}`,
  qs:[
    {q:'<code>Student s = new Student("Rahul", …);</code> s is…', o:['managed','transient','detached','removed'], a:1, ex:'@Entity only makes it eligible.'},
    {q:'After <code>@Transactional</code> method returns, the entity it loaded is…', o:['managed forever','detached','removed','transient'], a:1, ex:'Transaction-scoped context ended.'},
    {q:'<code>entityManager.contains(s)</code> after <code>detach(s)</code>?', o:['true','false','throws','null'], a:1, ex:'No longer managed.'},
    {q:'<code>remove(s)</code> means the DELETE…', o:['runs on that exact line','is scheduled and sent at flush','never runs','runs at next app start'], a:1, ex:'remove is a lifecycle transition.'},
    {q:'detach(s) vs remove(s): which deletes the row?', o:['detach','remove','both','neither'], a:1, ex:'detach only stops tracking.'}]},

{ id:'2-5', title:'Stop calling merge "to be safe"', kind:'java', xp:30, file:'StudentService.java',
  body:`<p>A loaded entity is <b>managed</b>. Change a field and, before commit, dirty checking sends the UPDATE. No <code>update()</code>, no <code>merge()</code>, no manual <code>flush()</code>. JPA doesn't even have <code>EntityManager.update()</code>.</p>
<p>But that only works inside a transaction. Put <code>@Transactional</code> on the service method (the business operation), and <code>@Transactional(readOnly = true)</code> on pure reads.</p>
<div class="warn">This service has no transaction and piles on merge and flush. Clean it up.</div>
${deep(L2,'aop','why transactions belong in the service')}`,
  task:{t:'Let dirty checking do its job', items:['updateStudent is transactional.','getStudent is a read-only transaction.','No merge, flush, save or update calls.','Keep the not-found check and the setter.']},
  starter:`@Service
public class StudentService {
    private final StudentPersistenceRepository repository;
    private final EntityManager entityManager;
    // constructor omitted

    public void updateStudent(Long id, String newName) {
        Student student = repository.findById(id);
        if (student == null) {
            throw new IllegalArgumentException("Student not found: " + id);
        }
        student.setName(newName);
        entityManager.merge(student);   // "to be safe"
        entityManager.flush();          // "to be really safe"
    }

    public Student getStudent(Long id) {
        return repository.findById(id);
    }
}`,
  tests:[
    {n:'updateStudent is @Transactional', t:has(/@Transactional(?:\(\))? ?public void updateStudent/), h:'Put @Transactional on updateStudent.'},
    {n:'getStudent is read-only', t:has(/@Transactional\(readOnly ?= ?true\) ?public Student getStudent/), h:'@Transactional(readOnly = true) on getStudent.'},
    {n:'No merge()', t:not(/\.merge\(/), h:'The entity is already managed. merge is for detached state.'},
    {n:'No manual flush()', t:not(/\.flush\(/), h:'Spring flushes before commit.'},
    {n:'No save()/update()', t:not(/\.(save|update)\(/), h:'Dirty checking generates the UPDATE.'},
    {n:'Still sets the name', t:has(/student\.setName\(newName\);/), h:'Keep student.setName(newName);'},
    {n:'Still rejects unknown ids', t:has(/throw new IllegalArgumentException/), h:'Keep the not-found check.'}],
  out:['Hibernate: select s.id, s.age, s.email, s.name from students s where s.id=?','Hibernate: update students set age=?, email=?, name=? where id=?','(commit)'],
  solution:`@Service
public class StudentService {
    private final StudentPersistenceRepository repository;
    private final EntityManager entityManager;
    // constructor omitted

    @Transactional
    public void updateStudent(Long id, String newName) {
        Student student = repository.findById(id);
        if (student == null) {
            throw new IllegalArgumentException("Student not found: " + id);
        }
        student.setName(newName);
    }

    @Transactional(readOnly = true)
    public Student getStudent(Long id) {
        return repository.findById(id);
    }
}`},

{ id:'2-6', title:'merge() returns a different object', kind:'java', xp:25, file:'StudentService.java',
  body:`<p><code>merge(detached)</code> copies the detached object's state into a <b>managed</b> instance and returns it. The argument stays detached. Changes to it afterwards are not tracked.</p>
<pre>Student managed = entityManager.merge(detached);   <span class="tc">// use this one</span></pre>
<div class="warn">The code below changes the wrong object. The rename silently never saves.</div>
${deep(L2,'gotcha','the merge gotcha')}`,
  task:{t:'Make the rename stick', items:['Keep the result of merge in a variable.','Change and return the managed instance.','Don\'t touch <code>detached</code> after merging.']},
  starter:`@Transactional
public Student rename(Student detached, String newName) {
    entityManager.merge(detached);
    detached.setName(newName);
    return detached;
}`,
  tests:[
    {n:'Change reaches the managed instance', t:c => { const v = mergeVar(c); return (v && v !== 'detached' && new RegExp(v + '\\.setName\\(newName\\)').test(c)) || /detached\.setName\(newName\); ?return entityManager\.merge\(detached\);/.test(c); }, h:'Student managed = entityManager.merge(detached); managed.setName(newName);'},
    {n:'Returns the managed instance', t:c => { const v = mergeVar(c); return (v && new RegExp('return ' + v + ';').test(c)) || /return entityManager\.merge\(detached\);/.test(c); }, h:'return managed;'},
    {n:'Detached object not changed after merge', t:c => !/merge\(detached\)[\s\S]*detached\.setName/.test(c), h:'After merging, changes to detached are lost.'}],
  solution:`@Transactional
public Student rename(Student detached, String newName) {
    Student managed = entityManager.merge(detached);
    managed.setName(newName);
    return managed;
}`},

{ id:'2-7', title:'Import 100,000 students', kind:'java', xp:30, file:'ImportService.java',
  body:`<p>Persisting 100,000 entities in one loop keeps all of them managed: memory and dirty-checking work explode. Every 100 rows: <code>flush()</code> (send pending SQL; still managed) then <code>clear()</code> (detach everything).</p>
<div class="warn">Order matters. <code>clear()</code> before <code>flush()</code> throws away changes that haven't been sent. And <code>i % 100 == 0</code> fires at i = 0, after just one student.</div>
${deep(L2,'batch','run the batch simulator')}`,
  task:{t:'Batch the import', items:['Every 100 students: flush, then clear.','Use <code>(i + 1) % 100 == 0</code>.']},
  starter:`@Transactional
public void importStudents(List<Student> students) {
    for (int i = 0; i < students.size(); i++) {
        entityManager.persist(students.get(i));
        // TODO: every 100 students, send the pending SQL and empty the context
    }
}`,
  tests:[
    {n:'Still persists each student', t:has(/entityManager\.persist\(students\.get\(i\)\);/), h:'Keep entityManager.persist(students.get(i));'},
    {n:'Every 100th student', t:has(/\(i ?\+ ?1\) ?% ?100 ?== ?0/), h:'if ((i + 1) % 100 == 0)'},
    {n:'No off-by-one at i = 0', t:c => !/\bi ?% ?100 ?== ?0/.test(c.replace(/\(i ?\+ ?1\)/g, 'X')), h:'i % 100 == 0 fires after the very first student.'},
    {n:'flush() then clear()', t:has(/entityManager\.flush\(\); ?entityManager\.clear\(\);/), h:'entityManager.flush(); entityManager.clear(); in that order.'},
    {n:'Never clear before flush', t:not(/entityManager\.clear\(\); ?entityManager\.flush\(\);/), h:'clear first discards pending changes.'}],
  out:['… 1,000 batches of 100 inserts …','peak managed entities: 100'],
  solution:`@Transactional
public void importStudents(List<Student> students) {
    for (int i = 0; i < students.size(); i++) {
        entityManager.persist(students.get(i));
        if ((i + 1) % 100 == 0) {
            entityManager.flush();
            entityManager.clear();
        }
    }
}`},

{ id:'2-8', title:'All or nothing: the transfer', kind:'quiz', xp:15,
  body:`<p>Two UPDATEs move ₹100 from account 1 to account 2. If the second failed alone, money would vanish. Wrap them in one <b>transaction</b>: <code>BEGIN</code> … <code>COMMIT</code>. This is what <code>@Transactional</code> does around your method.</p>
<pre>BEGIN;
UPDATE accounts SET balance = balance - 100 WHERE id = 1;
UPDATE accounts SET balance = balance + 100 WHERE id = 2;
COMMIT;</pre>
${deep(L2,'tx','toggle the failure and see rollback')}`,
  qs:[
    {q:'Why put both UPDATEs in one transaction?', o:['it makes the UPDATEs faster','both happen or neither does','it avoids writing SQL','it removes the need for account ids'], a:1, ex:'All or nothing keeps the total money correct.'},
    {q:'What does <code>@Transactional</code> do around a method?', o:['copies the table before the method runs','makes the method run in a new thread','opens a transaction before the method and commits after it; an unchecked exception rolls it back','turns every field into a column'], a:2, ex:'Begin before, commit after, roll back on a runtime exception.'},
    {q:'Account 1 had 1000 and account 2 had 500. After the transfer of 100 they hold…', o:['900 and 600','1100 and 400','900 and 500','1000 and 600'], a:0, ex:'One loses 100, the other gains 100, so the total stays 1500.'},
    {q:'The second UPDATE fails after the first succeeded. Inside a transaction…', o:['account 1 stays debited and the money vanishes','the first UPDATE is rolled back, so no money vanishes','account 2 is credited anyway','the app freezes'], a:1, ex:'Rollback undoes the first UPDATE.'}]},

{ id:'3-1', title:'How many to how many?', kind:'quiz', xp:10,
  body:`<div class="ana">Each student wears an <b>ID card</b> with a department number. The department's wall roster is a convenience copy. Officially, the cards decide. Cards = foreign key on the <b>owning side</b>; roster = <b>inverse side</b>.</div>
<p>Cardinality: <code>@OneToOne</code>, <code>@OneToMany</code>, <code>@ManyToOne</code>, <code>@ManyToMany</code>. One-to-many and many-to-one are two views of the <i>same</i> foreign key. Uni/bidirectional is only about Java navigation.</p>
${deep(L3,'cardinality','cardinality game')}`,
  qs:[
    {q:'<code>Order.customer</code> (many orders, one customer) is…', o:['@OneToOne','@OneToMany','@ManyToOne','@ManyToMany'], a:2, ex:'Many → one.'},

    {q:'Students and Courses need…', o:['a FK on students','a FK on courses','a join table','an embeddable'], a:2, ex:'Many-to-many → join table.'}]},

{ id:'3-2', title:'student.getDepartment().getName() in SQL', kind:'quiz', xp:15,
  body:`<p>In Java you follow a reference. In SQL the same thing is a join on the foreign key: <code>students.department_id → departments.id</code>. This is the SQL Hibernate runs behind <code>student.getDepartment().getName()</code>:</p>
<pre>SELECT s.name, d.name AS department
FROM students s
JOIN departments d ON d.id = s.department_id
ORDER BY s.id;</pre>
<p>Read it as: for each student, find the department row whose <code>id</code> matches the student's <code>department_id</code>.</p>`,
  qs:[
    {q:'Which condition follows the foreign key from a student to their department?', o:['<code>ON d.id = s.department_id</code>','<code>ON s.id = d.id</code>','<code>ON s.name = d.name</code>','<code>ON s.department_id = s.id</code>'], a:0, ex:'The FK column (students.department_id) is compared with the primary key it points to (departments.id).'},
    {q:'A student has <code>department_id = NULL</code>. With a plain <code>JOIN</code>, that student…', o:['appears with an empty department','is left out of the result','makes the query fail','appears twice'], a:1, ex:'A plain (inner) JOIN keeps only rows that have a match.'},
    {q:'Which join keeps students that have no department?', o:['<code>INNER JOIN</code>','<code>LEFT JOIN</code> starting from students','<code>CROSS JOIN</code>','<code>JOIN</code> plus <code>WHERE department_id IS NULL</code>'], a:1, ex:'LEFT JOIN from students keeps every student. The department columns are NULL where there is no match.'},

  tests:[

    {n:'No @JoinColumn on the inverse side', t:not(/@JoinColumn/), h:'Student.department owns the join column.'},
    {n:'addStudent sets both sides', t:c => { const m = c.match(/void addStudent\(Student (\w+)\) ?\{([^}]*)\}/); return !!m && new RegExp(`students\\.add\\(${m[1]}\\)`).test(m[2]) && new RegExp(`${m[1]}\\.setDepartment\\(this\\)`).test(m[2]); }, h:'students.add(student); student.setDepartment(this);'},

  solution:`@Entity

{ id:'3-6', title:'One user, at most one profile', kind:'java', xp:30, file:'Profile.java',
  body:`<p>A plain foreign key allows repeats: that's many-to-one. One-to-one = <b>foreign key + unique constraint</b>. Profile holds the join column, so it's the owning side; <code>User.profile</code> is the inverse with <code>mappedBy = "user"</code>.</p>
<p>Mandatory: <code>@OneToOne(optional = false)</code> plus <code>nullable = false</code>. (Alternative: shared primary key with <code>@MapsId</code>.)</p>
${deep(L3,'o2o','insert extra profiles and watch unique stop them')}`,
  task:{t:'Map Profile ↔ User', items:['Profile.user: column <code>user_id</code>, unique, required.','User.profile: inverse side.']},
  starter:`@Entity
public class Profile {
    @Id @GeneratedValue
    private Long id;
    private String bio;

    // TODO: owning side. Column user_id, required, at most one profile per user
    private User user;
}

@Entity
public class User {
    @Id @GeneratedValue
    private Long id;
    private String username;

    // TODO: inverse side
    private Profile profile;
}`,
  tests:[
    {n:'@OneToOne(optional = false) on Profile.user', t:has(/@OneToOne\(optional ?= ?false\) ?(?:@JoinColumn\([^)]*\) ?)?private User user;|@JoinColumn\([^)]*\) ?@OneToOne\(optional ?= ?false\) ?private User user;/), h:'@OneToOne(optional = false) above private User user;'},
    {n:'user_id, unique, NOT NULL', t:c => { const a = ann(c, /@JoinColumn\(([^)]*)\)/); return /name ?= ?"user_id"/.test(a) && /unique ?= ?true/.test(a) && /nullable ?= ?false/.test(a); }, h:'@JoinColumn(name = "user_id", nullable = false, unique = true)'},
    {n:'User.profile is the inverse side', t:has(/@OneToOne\(mappedBy ?= ?"user"\) ?private Profile profile;/), h:'@OneToOne(mappedBy = "user") above private Profile profile;'},
    {n:'Only one join column', t:c => (c.match(/@JoinColumn/g) || []).length === 1, h:'The inverse side has no @JoinColumn.'}],
  solution:`@Entity
public class Profile {
    @Id @GeneratedValue
    private Long id;
    private String bio;

    @OneToOne(optional = false)
    @JoinColumn(name = "user_id", nullable = false, unique = true)
    private User user;
}

@Entity
public class User {
    @Id @GeneratedValue
    private Long id;
    private String username;

    @OneToOne(mappedBy = "user")
    private Profile profile;
}`},

{ id:'3-7', title:'Enrol Priya in Spring', kind:'quiz', xp:15,
  body:`<p>Many-to-many lives in a join table, one row per pair. <code>priya.addCourse(spring)</code> changes the owning collection, so Hibernate inserts one pair. The table has <code>UNIQUE(student_id, course_id)</code>.</p>
<pre>student_course(student_id, course_id)</pre>
<p>Priya is id 2 and Spring is id 102, so the SQL Hibernate sends is:</p>
<pre>INSERT INTO student_course(student_id, course_id) VALUES (2, 102);</pre>`,

{ id:'3-9', title:'@ManyToMany with a join table', kind:'java', xp:30, file:'Student.java',
  body:`<p>The side with <code>@JoinTable</code> owns the relationship. <code>joinColumns</code> point at the owner (<code>student_id</code>), <code>inverseJoinColumns</code> at the other entity (<code>course_id</code>). A unique constraint on the pair blocks duplicate enrolments. <code>Course.students</code> is the inverse side.</p>
<div class="warn">No <code>CascadeType.REMOVE</code> here: courses are shared. Deleting one student must not delete Java for everyone.</div>
${deep(L3,'m2m','click the enrolment grid')}`,
  task:{t:'Map Student ↔ Course', items:['Join table <code>student_course</code>: student_id → owner, course_id → other.','Unique (student_id, course_id).','Course side: mappedBy.','addCourse keeps both sides in sync.']},
  starter:`@Entity
public class Student {
    @Id
    private Long id;

    // TODO: owning side, join table student_course(student_id, course_id), pair unique
    private Set<Course> courses = new HashSet<>();

    public void addCourse(Course course) {
        courses.add(course);
        // TODO: keep the other side in sync
    }
}

@Entity
public class Course {
    @Id
    private Long id;

    // TODO: inverse side
    private Set<Student> students = new HashSet<>();
}`,
  tests:[
    {n:'@ManyToMany + @JoinTable student_course', t:has(/@ManyToMany ?@JoinTable\(name ?= ?"student_course"/), h:'@ManyToMany then @JoinTable(name = "student_course", …)'},
    {n:'joinColumns → student_id', t:has(/joinColumns ?= ?@JoinColumn\(name ?= ?"student_id"\)/), h:'joinColumns = @JoinColumn(name = "student_id")'},
    {n:'inverseJoinColumns → course_id', t:has(/inverseJoinColumns ?= ?@JoinColumn\(name ?= ?"course_id"\)/), h:'inverseJoinColumns = @JoinColumn(name = "course_id")'},
    {n:'Pair is unique', t:has(/uniqueConstraints ?= ?@UniqueConstraint\(columnNames ?= ?\{ ?"student_id", ?"course_id" ?\}\)/), h:'uniqueConstraints = @UniqueConstraint(columnNames = {"student_id", "course_id"})'},
    {n:'Course side is mappedBy "courses"', t:has(/@ManyToMany\(mappedBy ?= ?"courses"\) ?private Set<Student> students/), h:'@ManyToMany(mappedBy = "courses")'},
    {n:'addCourse syncs the other side', t:has(/course\.getStudents\(\)\.add\(this\);/), h:'course.getStudents().add(this);'},
    {n:'No cascade remove on shared courses', t:not(/CascadeType\.(REMOVE|ALL)/), h:'Shared entities must not be cascade-deleted.'}],
  solution:`@Entity
public class Student {
    @Id
    private Long id;

    @ManyToMany
    @JoinTable(
        name = "student_course",
        joinColumns = @JoinColumn(name = "student_id"),
        inverseJoinColumns = @JoinColumn(name = "course_id"),
        uniqueConstraints = @UniqueConstraint(columnNames = {"student_id", "course_id"})
    )
    private Set<Course> courses = new HashSet<>();

    public void addCourse(Course course) {
        courses.add(course);
        course.getStudents().add(this);
    }
}

@Entity
public class Course {
    @Id
    private Long id;

    @ManyToMany(mappedBy = "courses")
    private Set<Student> students = new HashSet<>();
}`},

{ id:'4-1', title:'What flows through a relationship?', kind:'quiz', xp:10,
  body:`<div class="ana">Cancel a restaurant bill and its side dishes go too, but not the chef every table shares. <b>Cascade remove</b> is for things that belong only to you.</div>
<p>A <b>cascade</b> propagates an operation (PERSIST, MERGE, REMOVE, REFRESH, DETACH, ALL) across a relationship. It's <b>off by default</b>. It is not ownership: the FK is still set by the owning side.</p>
${deep(L4,'cascade','cascade simulator')}`,
  qs:[
    {q:'No cascade on Order.items. persist(order) with 3 new items saves…', o:['order + 3 items','only the order','only items','nothing'], a:1, ex:'Items stay transient.'},
    {q:'CascadeType.REMOVE is safe on…', o:['@ManyToMany courses','Order → OrderItem it exclusively owns','Student → Department','any relationship'], a:1, ex:'Only owned children.'},
    {q:'With cascade remove, which DELETE runs first?', o:['orders','order_item','either','none'], a:1, ex:'Children first keeps the FK valid.'},
    {q:'CascadeType.ALL should be used…', o:['by default','only when the child shares the parent\'s whole lifecycle','on many-to-many','never'], a:1, ex:'It includes REMOVE.'}]},

{ id:'4-2', title:'Save the order, save its items', kind:'java', xp:30, file:'Order.java',
  body:`<p>Items are created with their order and deleted with it, so cascade <b>PERSIST</b> and <b>REMOVE</b> (or ALL). And because <code>OrderItem.order</code> owns <code>order_id</code>, the helper must set it, or items are saved with <code>order_id = NULL</code>.</p>
<pre>order.addItem(item1); order.addItem(item2);
entityManager.persist(order);   <span class="tc">// persists items too</span></pre>
${deep(L4,'cascade','try it without the helper')}`,
  task:{t:'Cascade and sync', items:['Cascade PERSIST and REMOVE on items.','Keep mappedBy = "order".','addItem sets the owning side.']},
  starter:`@Entity
@Table(name = "orders")
public class Order {
    @Id
    @GeneratedValue(strategy = GenerationType.IDENTITY)
    private Long id;

    // TODO: items are created with the order and deleted with it
    @OneToMany(mappedBy = "order")
    private List<OrderItem> items = new ArrayList<>();

    public void addItem(OrderItem item) {
        items.add(item);
        // TODO
    }
}`,
  tests:[
    {n:'Cascades persist and remove', t:c => { const a = ann(c, /@OneToMany\((.*?)\) ?private List<OrderItem> items/); return /CascadeType\.ALL/.test(a) || (/CascadeType\.PERSIST/.test(a) && /CascadeType\.REMOVE/.test(a)); }, h:'cascade = { CascadeType.PERSIST, CascadeType.REMOVE }'},
    {n:'Still mappedBy "order"', t:has(/mappedBy ?= ?"order"/), h:'Keep mappedBy = "order".'},
    {n:'addItem sets the owning side', t:has(/item\.setOrder\(this\);/), h:'item.setOrder(this);'},
    {n:'addItem still adds to the list', t:has(/items\.add\(item\);/), h:'items.add(item);'}],
  out:['insert into orders …','insert into order_item (order_id, …) values (100, …)  ×2'],
  solution:`@Entity
@Table(name = "orders")
public class Order {
    @Id
    @GeneratedValue(strategy = GenerationType.IDENTITY)
    private Long id;

    @OneToMany(mappedBy = "order", cascade = { CascadeType.PERSIST, CascadeType.REMOVE })
    private List<OrderItem> items = new ArrayList<>();

    public void addItem(OrderItem item) {
        items.add(item);
        item.setOrder(this);
    }
}`},

{ id:'4-3', title:'Lazy, eager and the defaults', kind:'quiz', xp:15,
  body:`<p>A static fetch strategy (<code>fetch = …</code>) is the default whenever the entity loads. <b>EAGER is a requirement; LAZY is a hint.</b> Defaults: <code>@OneToMany</code>, <code>@ManyToMany</code> LAZY; <code>@ManyToOne</code>, <code>@OneToOne</code> EAGER.</p>
<p>Lazy to-one is a <b>proxy</b>: <code>student.getDepartment()</code> doesn't necessarily load it; <code>.getName()</code> does.</p>
${deep(L4,'lazy','step through a lazy proxy')}`,
  qs:[
    {q:'Default fetch of @ManyToOne?', o:['LAZY','EAGER'], a:1, ex:'to-one is eager by default.'},
    {q:'Default fetch of @OneToMany?', o:['LAZY','EAGER'], a:0, ex:'to-many is lazy.'},
    {q:'Lazy department: which line can trigger SQL?', o:['Department d = s.getDepartment();','String n = s.getDepartment().getName();','neither','both always'], a:1, ex:'Reading real state initializes the proxy.'},
    {q:'LAZY in the JPA spec is…', o:['a requirement','a hint'], a:1, ex:'Hibernate supports it well.'}]},

{ id:'4-4', title:'Make the defaults lazy', kind:'java', xp:25, file:'Student.java',
  body:`<p>Many teams set to-one relationships to <code>LAZY</code> explicitly, keeping the default object graph small. Each use case then fetches what it needs.</p>
<div class="warn">A teammate "fixed" a slow page by making comments EAGER. Now every student load drags its comments along.</div>`,

}`},

{ id:'4-5', title:'Count the N+1', kind:'quiz', xp:15,
  body:`<div class="ana">A waiter making one trip per bowl of soup instead of carrying a tray.</div>
<p><code>findAll()</code> = 1 query. Then the loop prints <code>student.getDepartment().getName()</code>. Each <i>new</i> department costs one more SELECT; a department already in the persistence context costs nothing. Students with no department (<code>null</code>) cost nothing.</p>
<dl class="map"><dt><code>"lazy"</code></dt><dd>1 + number of distinct non-null departments</dd><dt><code>"graph"</code></dt><dd>@EntityGraph fetched them with the students: 1</dd><dt><code>"unused"</code></dt><dd>loop never touches department: 1</dd></dl>

    {q:'The loop never touches <code>department</code>. Queries in total?', o:['0','1','3','N + 1'], a:1, ex:'Lazy data that is never used is never loaded: just the findAll().'}]},

{ id:'4-6', title:'One tray: the joined query', kind:'quiz', xp:15,
  body:`<p>The fix for N+1 is to fetch students and departments together. Hibernate commonly uses a join for an entity graph. To keep every student, including Harsh who has no department, the join must be a LEFT JOIN:</p>

FROM students s
LEFT JOIN departments d ON d.id = s.department_id
ORDER BY s.id;</pre>

    {q:'Which join keeps Harsh, who has no department?', o:['<code>JOIN</code> (inner join)','<code>LEFT JOIN</code> starting from students','<code>CROSS JOIN</code>','<code>RIGHT JOIN</code> starting from students'], a:1, ex:'LEFT JOIN keeps every student on the left.'},

{ id:'5-4', title:'Rename without save()', kind:'java', xp:25, file:'StudentService.java',
  body:`<p><code>findById</code> returns <code>Optional&lt;Student&gt;</code>: unwrap with <code>.orElseThrow()</code>. Inside a transaction the loaded student is managed; the setter is enough. <code>save()</code> here is redundant: it's not what triggers the UPDATE.</p>

${deep(L5,'methods','save() vs dirty checking')}`,
  task:{t:'Fix renameStudent', items:['@Transactional.','Unwrap with orElseThrow().','No save().']},
  starter:`public void renameStudent(Long id, String newName) {
    Student student = studentRepository.findById(id);
    student.setName(newName);
    studentRepository.save(student);
}`,
  tests:[
    {n:'@Transactional', t:has(/@Transactional(?:\(\))? ?public void renameStudent/), h:'@Transactional above the method.'},
    {n:'Unwraps the Optional', t:has(/findById\(id\)\.orElseThrow\(/), h:'studentRepository.findById(id).orElseThrow()'},
    {n:'Still sets the name', t:has(/\.setName\(newName\);/), h:'student.setName(newName);'},
    {n:'No redundant save()', t:not(/\.save\(/), h:'Dirty checking does the UPDATE.'}],

{ id:'5-7', title:'Never trust ?sortBy=', kind:'java', xp:30, file:'StudentService.java',
  body:`<p><code>GET /students?sortBy=…&amp;direction=…</code> goes straight into <code>Sort</code>. A bad property becomes an ugly 500. Validate against an <b>allowlist</b> first, and add <code>id</code> as a <b>tie-breaker</b> so equal names don't shuffle between pages.</p>
${deep(L5,'sort','sort simulator with allowlist')}`,
  task:{t:'Safe dynamic sorting', items:['<code>ALLOWED_SORT_FIELDS = Set.of("name", "age", "admissionDate")</code>','Reject others with <code>IllegalArgumentException("Unsupported sort property: " + sortBy)</code> before building the Sort.','Then sort by id ascending as tie-breaker.']},
  starter:`public List<Student> list(String sortBy, String direction) {
    // straight from GET /students?sortBy=...&direction=...
    Sort sort = Sort.by(Sort.Direction.fromString(direction), sortBy);
    return studentRepository.findAll(sort);
}`,
  tests:[
    {n:'Allowlist with the three fields', t:c => /Set<String> ALLOWED_SORT_FIELDS ?= ?Set\.of\(/.test(c) && ['"name"','"age"','"admissionDate"'].every(s => ann(c, /ALLOWED_SORT_FIELDS ?= ?Set\.of\(([^)]*)\)/).includes(s)), h:'private static final Set<String> ALLOWED_SORT_FIELDS = Set.of("name", "age", "admissionDate");'},
    {n:'Rejects unknown properties', t:c => /!ALLOWED_SORT_FIELDS\.contains\(sortBy\)/.test(c) && /throw new IllegalArgumentException/.test(c), h:'if (!ALLOWED_SORT_FIELDS.contains(sortBy)) throw new IllegalArgumentException(…);'},
    {n:'Validates before building the Sort', t:c => c.indexOf('ALLOWED_SORT_FIELDS.contains') > -1 && c.indexOf('ALLOWED_SORT_FIELDS.contains') < c.indexOf('Sort.Direction.fromString'), h:'Check first, then Sort.by(...).'},
    {n:'id tie-breaker', t:has(/\.and\(Sort\.by\("id"\)(?:\.ascending\(\))?\)/), h:'.and(Sort.by("id").ascending())'}],
  solution:`private static final Set<String> ALLOWED_SORT_FIELDS =
        Set.of("name", "age", "admissionDate");

public List<Student> list(String sortBy, String direction) {
    if (!ALLOWED_SORT_FIELDS.contains(sortBy)) {
        throw new IllegalArgumentException("Unsupported sort property: " + sortBy);
    }
    Sort sort = Sort.by(Sort.Direction.fromString(direction), sortBy)
            .and(Sort.by("id").ascending());
    return studentRepository.findAll(sort);
}`},

}

}

/* ---------- SQL helpers ---------- */
function freshDb() { const db = new SQLJS.Database(); db.run(SEED); return db; }
// Always free the database afterwards. The in-browser engine has a fixed memory budget.
function withDb(fn) { const db = freshDb(); try { return fn(db); } finally { try { db.close(); } catch (e) {} } }
const sqlErrMsg = err => /Aborted|OOM|out of memory/i.test(err.message)
  ? 'The in-browser database ran out of memory. Reload the page; your progress and code are saved.'
  : 'SQL error: ' + err.message;
function runAll(db, sql) {
  const out = [];
  for (const st of db.iterateStatements(sql)) {
    const cols = st.getColumnNames();
    if (cols.length) { const rows = []; while (st.step()) rows.push(st.get()); out.push({ sql: st.getSQL(), cols, rows }); }
    else { st.step(); out.push({ sql: st.getSQL(), affected: db.getRowsModified() }); }
  }
  return out;
}
function table(r) {
  return `<table><tr>${r.cols.map(h => `<th>${esc(h)}</th>`).join('')}</tr>${r.rows.slice(0, 50).map(row => `<tr>${row.map(v => v === null ? '<td class="null">NULL</td>' : `<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</table><div class="info">${r.rows.length} row${r.rows.length === 1 ? '' : 's'}</div>`;
}
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);

/* ---------- normalizer for code checks ---------- */
function normalize(code, lang) {
  if (lang === 'properties') return code.split('\n').map(x => x.trim()).filter(x => x && !x.startsWith('#')).join(' ').replace(/\s+/g, ' ');
  let out = '', buf = '', i = 0; const n = code.length;
  const flush = () => { out += buf.replace(/\s+/g, ' ').replace(/ ?([()[\],;.{}]) ?/g, '$1'); buf = ''; };
  while (i < n) {
    const ch = code[i], nx = code[i + 1];
    if (ch === '/' && nx === '/') { while (i < n && code[i] !== '\n') i++; buf += ' '; continue; }
    if (ch === '/' && nx === '*') { i += 2; while (i < n && !(code[i] === '*' && code[i + 1] === '/')) i++; i += 2; buf += ' '; continue; }
    if (ch === '"' || ch === "'" || ch === '`') {
      flush(); let j = i + 1;
      while (j < n && code[j] !== ch && (ch === '`' || code[j] !== '\n')) { if (code[j] === '\\') j++; j++; }
      j++; out += code.slice(i, j).replace(/\s+/g, ' '); i = j; continue;
    }
    buf += ch; i++;
  }
  flush(); return out.trim();
}

/* ---------- editor challenge (java / properties / sql) ---------- */
function editor(c, l) {
  const isSql = l.kind === 'sql', code = S.code[l.id] ?? l.starter;
  const isJs = l.kind === 'js';
  const fname = l.file || (isSql ? 'query.sql' : isJs ? 'solution.js' : 'Main.java');
  c.innerHTML = head(l) + taskBox(l) + `
    <div class="ed${S.code[l.id] == null ? ' fresh' : ''}" id="ed"><div class="file"><span>${esc(fname)}<span class="edit-tip"> · ✎ YOUR CODE: click inside and replace the TODO lines</span></span><span class="ed-tools"><button class="tbtn" type="button" id="ed-focus">${document.body.classList.contains('focus') ? '⤡ Show lesson' : '⤢ Bigger editor'}</button><span id="ed-reset-zone"><button class="tbtn" type="button" id="ed-reset">Reset code</button></span></span></div>
      <pre class="gut" id="gut" aria-hidden="true"></pre><textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Code editor"></textarea></div>
    <div class="actions">${isSql ? '<button class="btn" type="button" id="run">▶ Run</button>' : ''}<button class="btn go" type="button" id="submit">${isSql ? 'Submit' : 'Run tests'}</button>
      <span id="sol-zone"></span><span class="hintk">Ctrl + Enter = ${isSql ? 'Run' : 'Run tests'}</span></div>
    <div class="con" id="con"><div class="ch"><span>console</span><span>${isSql ? 'SQLite in your browser' : isJs ? 'JavaScript · runs for real' : l.lang === 'properties' ? 'config checker' : 'Java checker · rules, not a compiler'}</span></div><div class="cb" id="cb"><div class="info">${isSql ? 'Press Run to execute. Submit checks your answer.' : 'Press Run tests. Each check gives a hint when it fails.'}</div></div></div>
    <div id="res"></div>${l.kind === 'java' && l.lang !== 'properties' ? '<p class="hintk">This checks the shape of your code. The local quests compile and run real Java tests.</p>' : ''}`;
  const ta = $('#code'), gut = $('#gut');
  ta.value = code;
  const gutter = () => { gut.textContent = Array.from({ length: ta.value.split('\n').length }, (_, k) => k + 1).join('\n'); gut.scrollTop = ta.scrollTop; };
  gutter();
  ta.addEventListener('input', () => { S.code[l.id] = ta.value; save(); gutter(); $('#ed').classList.remove('fresh'); });
  ta.addEventListener('scroll', () => gut.scrollTop = ta.scrollTop);
  // VS Code-style editing: auto-close pairs, step over closers, smart Enter/Backspace, Tab/Shift+Tab.
  const PAIRS = { '(': ')', '[': ']', '{': '}', '"': '"', "'": "'" };
  const CLOSERS = new Set([')', ']', '}', '"', "'"]);
  const put = (text, a, b, caret) => {   // execCommand keeps Ctrl+Z working
    ta.setSelectionRange(a, b);
    if (!document.execCommand('insertText', false, text)) { ta.setRangeText(text, a, b, 'end'); ta.dispatchEvent(new Event('input')); }
    if (caret != null) ta.setSelectionRange(caret, caret);
  };
  ta.addEventListener('keydown', e => {
    const s = ta.selectionStart, en = ta.selectionEnd, v = ta.value, prev = v[s - 1], next = v[s];
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); (isSql ? $('#run') : $('#submit')).click(); return; }
    if (e.ctrlKey || e.metaKey || e.altKey || e.isComposing) return;
    if (e.key === 'Tab') {
      e.preventDefault();
      if (e.shiftKey) {
        const ls = v.lastIndexOf('\n', s - 1) + 1, m = v.slice(ls, ls + 4).match(/^ {1,4}/);
        if (m) { put('', ls, ls + m[0].length); ta.setSelectionRange(Math.max(ls, s - m[0].length), Math.max(ls, en - m[0].length)); }
      } else put('    ', s, en);
      return;
    }
    if (e.key === 'Enter') {
      e.preventDefault();
      const line = v.slice(0, s).split('\n').pop(), base = line.match(/^\s*/)[0], opens = /[{([]\s*$/.test(line), inner = base + (opens ? '    ' : '');
      if (opens && s === en && /^[}\])]/.test(next || '')) put('\n' + inner + '\n' + base, s, en, s + 1 + inner.length);
      else put('\n' + inner, s, en);
      return;
    }
    if (e.key === 'Backspace' && s === en && s > 0 && PAIRS[prev] && PAIRS[prev] === next) { e.preventDefault(); put('', s - 1, s + 1); return; }
    if (s === en && next === e.key && CLOSERS.has(e.key)) { e.preventDefault(); ta.setSelectionRange(s + 1, s + 1); return; }
    if (PAIRS[e.key]) {
      const quote = e.key === '"' || e.key === "'";
      if (s !== en) { e.preventDefault(); put(e.key + v.slice(s, en) + PAIRS[e.key], s, en); ta.setSelectionRange(s + 1, en + 1); return; }
      if (quote && /\w/.test(prev || '')) return;          // don't pair the apostrophe in "don't"
      if (next && !/[\s)\]};,]/.test(next)) return;         // only pair before space, a closer or end of line
      e.preventDefault(); put(e.key + PAIRS[e.key], s, en, s + 1);
    }
  });
  const bindReset = () => {
    $('#ed-reset').onclick = () => {
      $('#ed-reset-zone').innerHTML = `<span class="confirm">Lose your edits? <button class="tbtn" type="button" id="er-yes">Reset</button><button class="tbtn" type="button" id="er-no">Keep</button></span>`;
      $('#er-yes').onclick = () => { delete S.code[l.id]; save(); editor(c, l); };
      $('#er-no').onclick = () => { $('#ed-reset-zone').innerHTML = '<button class="tbtn" type="button" id="ed-reset">Reset code</button>'; bindReset(); };
    };
  };
  bindReset();
  $('#ed-focus').onclick = () => {
    const on = document.body.classList.toggle('focus');
    $('#ed-focus').textContent = on ? '⤡ Show lesson' : '⤢ Bigger editor';
    $('#exit-focus')?.remove();
    if (on) $('.chal-head').insertAdjacentHTML('beforeend', '<button class="tbtn" type="button" id="exit-focus" style="margin-left:auto">⤡ Show lesson &amp; menu</button>');
    ta.focus();
  };
  solZone(l);
  const cb = $('#cb');
  if (isSql) {
    $('#run').onclick = () => {
      if (!SQLJS) { cb.innerHTML = `<div class="fail">${sqlErr ? 'The SQL engine could not load. Check your connection and reload.' : 'SQL engine is still loading…'}</div>`; return; }
      try {
        const res = withDb(db => runAll(db, ta.value));
        cb.innerHTML = res.length ? res.map(r => `<div class="info">› ${esc(r.sql.trim().slice(0, 90))}</div>` + (r.cols ? table(r) : `<div class="out">${r.affected} row${r.affected === 1 ? '' : 's'} affected <span class="info">(what executeUpdate() would return)</span></div>`)).join('') : '<div class="info">Nothing to run.</div>';
      } catch (err) { cb.innerHTML = `<div class="fail">${esc(sqlErrMsg(err))}</div>`; }
    };
  }
  $('#submit').onclick = () => isSql ? submitSql(l, ta.value, cb) : isJs ? submitJs(l, ta.value, cb) : submitCode(l, ta.value, cb);
}
function solZone(l) {
  const z = $('#sol-zone'); if (!z) return;
  if ((S.fails[l.id] || 0) < 2 && !S.peeked[l.id]) { z.innerHTML = ''; return; }
  z.innerHTML = `<button class="btn ghost" type="button" id="sol">Show solution</button>`;
  $('#sol').onclick = () => {
    z.innerHTML = `<span class="confirm">${S.done[l.id] || S.peeked[l.id] ? 'Show it?' : 'Reveal? This lesson then pays half XP.'} <button class="tbtn" type="button" id="sol-yes">Reveal</button><button class="tbtn" type="button" id="sol-no">Not yet</button></span>`;
    $('#sol-no').onclick = () => solZone(l);
    $('#sol-yes').onclick = () => {
      if (!S.done[l.id]) { S.peeked[l.id] = true; save(); }
      $('#res').innerHTML = `<div class="task"><b class="t">Solution</b><pre class="cpre">${esc(l.solution)}</pre><div class="actions"><button class="btn" type="button" id="sol-use">Put it in the editor</button><button class="btn ghost" type="button" id="sol-hide">✕ Hide solution</button></div></div>`;
      $('#sol-use').onclick = () => { $('#code').value = l.solution; $('#code').dispatchEvent(new Event('input')); $('#res').innerHTML = ''; $('#code').focus(); $('#code').scrollIntoView({ block:'center' }); };
      $('#sol-hide').onclick = () => { $('#res').innerHTML = ''; $('#code').focus(); };
      solZone(l);
    };

}
function fail(l) { S.fails[l.id] = (S.fails[l.id] || 0) + 1; save(); solZone(l); }
function win(l, cb, extra) {
  const g = award(l);
  $('#res').innerHTML = `<div class="banner win"><span>All checks passed${g ? ` · +${g} XP` : ''}</span>${nextBtn(l)}</div>`;
  if (extra) cb.innerHTML += extra;
  const h = $('.chal-head'); if (h && !h.querySelector('.donechip')) h.insertAdjacentHTML('beforeend', '<span class="donechip">✓ completed</span>');
}
function submitCode(l, code, cb) {
  const n = normalize(code, l.lang);
  const results = l.tests.map(t => { let ok = false; try { ok = !!t.t(n); } catch (e) {} return { ...t, ok }; });
  const passed = results.filter(r => r.ok).length;
  cb.innerHTML = results.map(r => `<div class="${r.ok ? 'pass' : 'fail'}">${r.ok ? '✓' : '✗'} ${esc(r.n)}</div>${r.ok ? '' : `<div class="hint">hint: ${esc(r.h)}</div>`}`).join('') +
    `<div class="info">${passed} / ${results.length} checks passed</div>`;
  if (passed === results.length) win(l, cb, l.out ? `<div class="info" style="margin-top:6px">program output (simulated):</div>` + l.out.map(o => `<div class="out">${esc(o)}</div>`).join('') : '');
  else { $('#res').innerHTML = `<div class="banner lose">${results.length - passed} check${results.length - passed === 1 ? '' : 's'} failing. Read the hints.</div>`; fail(l); }
}
function submitSql(l, sql, cb) {
  if (!SQLJS) { cb.innerHTML = '<div class="fail">SQL engine is not ready yet.</div>'; return; }
  let lines = [], ok = true, db = null;
  try {
    db = freshDb();
    const res = runAll(db, sql);
    if (l.expect) {
      const mine = [...res].reverse().find(r => r.cols), want = withDb(d => runAll(d, l.expect)).pop();
      if (!mine) { ok = false; lines.push(['fail', 'Your SQL has no SELECT result to check. End with a query.']); }
      else {
        const colsOk = mine.cols.length === want.cols.length && (!l.matchCols || mine.cols.every((h, k) => h.toLowerCase() === want.cols[k].toLowerCase()));
        lines.push([colsOk ? 'pass' : 'fail', colsOk ? 'Right columns' : `Expected columns: ${want.cols.join(', ')} · got: ${mine.cols.join(', ')}`]);
        const rowsOk = same(mine.rows, want.rows) || (!l.ordered && same([...mine.rows].map(String).sort(), [...want.rows].map(String).sort()));
        lines.push([rowsOk ? 'pass' : 'fail', rowsOk ? `Right rows (${want.rows.length})` : `Expected ${want.rows.length} row(s), got ${mine.rows.length}${mine.rows.length === want.rows.length ? ' with different values or order' : ''}`]);
        ok = colsOk && rowsOk;
        cb.innerHTML = '<div class="info">your result:</div>' + table(mine);
      }
    }
    if (l.verify) {
      cb.innerHTML = res.map(r => r.cols ? table(r) : `<div class="out">› ${esc(r.sql.trim().slice(0, 80))} → ${r.affected} row(s) affected</div>`).join('');
      for (const v of l.verify) {
        const got = (db.exec(v.sql)[0]?.values) || [];
        const good = same(got, v.rows); ok = ok && good;
        lines.push([good ? 'pass' : 'fail', v.n + (good ? '' : ` · expected ${JSON.stringify(v.rows)}, found ${JSON.stringify(got)}`)]);
      }
    }
  } catch (err) { ok = false; lines.push(['fail', sqlErrMsg(err)]); }
  finally { try { db && db.close(); } catch (e) {} }
  cb.innerHTML += lines.map(([k, t]) => `<div class="${k}">${k === 'pass' ? '✓' : '✗'} ${esc(t)}</div>`).join('');
  if (ok) win(l, cb); else { $('#res').innerHTML = '<div class="banner lose">Not quite. Compare with the checks above.</div>'; fail(l); }
}

/* ---------- real JavaScript runner (kind: 'js') ---------- */
// Runs learner code in a throwaway Web Worker (blob URL) with a 2 s infinite-loop guard.
const WORKER_SRC = `
self.onmessage = e => {
  const { code, fn, cases } = e.data, logs = [];
  const show = v => { try { return v === undefined ? 'undefined' : JSON.stringify(v); } catch (x) { return String(v); } };
  const console = { log: (...a) => logs.push(a.map(x => typeof x === 'string' ? x : show(x)).join(' ')) };
  let f;
  try { f = new Function('console', code + '\\n;return typeof ' + fn + ' === "function" ? ' + fn + ' : undefined;')(console); }
  catch (err) { self.postMessage({ compileError: String(err), logs }); return; }
  if (!f) { self.postMessage({ compileError: 'No function named ' + fn + ' was found.', logs }); return; }
  const results = cases.map(c => {
    const args = JSON.parse(JSON.stringify(c.args));
    try {
      const got = f(...args), out = c.inPlace ? args[0] : got;
      return { n: c.n, ok: JSON.stringify(out) === JSON.stringify(c.expect), got: show(out), expect: show(c.expect) };
    } catch (err) { return { n: c.n, ok: false, got: 'threw ' + err, expect: show(c.expect) }; }
  });
  self.postMessage({ results, logs });
};`;
let workerUrl = null;
function runJs(code, fn, cases, timeout = 2000) {
  return new Promise(done => {
    workerUrl ??= URL.createObjectURL(new Blob([WORKER_SRC], { type: 'text/javascript' }));
    const w = new Worker(workerUrl);
    const t = setTimeout(() => { w.terminate(); done({ timeout: true }); }, timeout);
    w.onmessage = e => { clearTimeout(t); w.terminate(); done(e.data); };
    w.onerror = e => { e.preventDefault(); clearTimeout(t); w.terminate(); done({ compileError: e.message }); };
    w.postMessage({ code, fn, cases });
  });
}
async function submitJs(l, code, cb) {
  cb.innerHTML = '<div class="info">running…</div>';
  const r = await runJs(code, l.fn, l.cases, l.timeout || 2000);
  const logs = (r.logs || []).slice(0, 40).map(x => `<div class="out">${esc(x)}</div>`).join('');
  if (r.timeout) { cb.innerHTML = '<div class="fail">✗ Took longer than 2 seconds. Probably an infinite loop. Check that your pointers move.</div>'; $('#res').innerHTML = '<div class="banner lose">Stopped: too slow.</div>'; fail(l); return; }
  if (r.compileError) { cb.innerHTML = `<div class="fail">✗ ${esc(r.compileError)}</div>` + logs; $('#res').innerHTML = '<div class="banner lose">Your code didn\'t run. Fix the error above.</div>'; fail(l); return; }
  const rules = (l.tests || []).map(t => { let ok = false; try { ok = !!t.t(normalize(code)); } catch (e) {} return { ...t, ok }; });
  const lines = r.results.map(x => `<div class="${x.ok ? 'pass' : 'fail'}">${x.ok ? '✓' : '✗'} ${esc(x.n)}</div>${x.ok ? '' : `<div class="hint">expected ${esc(x.expect)} · got ${esc(x.got)}</div>`}`).join('') +
    rules.map(x => `<div class="${x.ok ? 'pass' : 'fail'}">${x.ok ? '✓' : '✗'} ${esc(x.n)}</div>${x.ok ? '' : `<div class="hint">hint: ${esc(x.h)}</div>`}`).join('');
  const passed = r.results.filter(x => x.ok).length + rules.filter(x => x.ok).length, total = r.results.length + rules.length;
  cb.innerHTML = lines + `<div class="info">${passed} / ${total} checks passed</div>` + (logs ? '<div class="info" style="margin-top:6px">console.log output:</div>' + logs : '');
  if (passed === total) win(l, cb); else { $('#res').innerHTML = `<div class="banner lose">${total - passed} failing. Compare expected vs got.</div>`; fail(l); }
}

/* ---------- attack sandbox ---------- */
function attack(c, l) {
  const a = l.attack;
  c.innerHTML = head(l) + taskBox(l) + `<div class="atk"><label for="atk-in" class="hintk">email typed by the "user"</label><input type="text" id="atk-in" spellcheck="false" autocomplete="off">
    <div class="glued" id="atk-sql"></div></div>
    <div class="con"><div class="ch"><span>query result</span><span>SQLite in your browser</span></div><div class="cb" id="atk-out"></div></div><div id="res"></div>`;
  const inp = $('#atk-in'); inp.value = S.code[l.id] ?? a.start;
  const go = () => {
    S.code[l.id] = inp.value; save();
    $('#atk-sql').innerHTML = esc(a.pre) + `<span class="u">${esc(inp.value)}</span>` + esc(a.post);
    if (!SQLJS) { $('#atk-out').innerHTML = `<div class="info">${sqlErr ? 'SQL engine failed to load.' : 'Loading SQL engine…'}</div>`; return; }
    try {
      const r = withDb(db => runAll(db, a.pre + inp.value + a.post)).find(x => x.cols);
      $('#atk-out').innerHTML = r ? table(r) : '<div class="info">no result</div>';
      if (r && r.rows.length === a.target) {
        if (!S.done[l.id]) { const g = award(l); $('#res').innerHTML = `<div class="banner win"><span>Breached! Every student leaked · +${g} XP</span>${nextBtn(l)}</div>`; }
        else $('#res').innerHTML = `<div class="banner win"><span>Breached. That's why we never glue input into SQL.</span>${nextBtn(l)}</div>`;
      } else $('#res').innerHTML = r ? `<div class="hintk">${r.rows.length} of ${a.target} students returned.</div>` : '';
    } catch (err) {
      const oom = /Aborted|OOM|out of memory/i.test(err.message);
      $('#atk-out').innerHTML = `<div class="fail">${esc(sqlErrMsg(err))}</div>` + (oom ? '' : '<div class="info">Your input broke the SQL. Close to an attack; keep the quotes balanced.</div>');
      $('#res').innerHTML = '';
    }
  };
  let wait = null;
  inp.addEventListener('input', () => { clearTimeout(wait); wait = setTimeout(go, 150); });  // run once you pause typing
  go();
}
